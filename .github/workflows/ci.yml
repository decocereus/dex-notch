name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: swift test

      - name: Build universal DMG
        env:
          DEX_ALLOW_ADHOC: "1"
        run: ./script/package_release.sh 0.0.0 1

      - name: Inspect artifact
        run: |
          codesign --verify --deep --strict --verbose=2 dist/release/Dex.app
          lipo dist/release/Dex.app/Contents/MacOS/Dex -verify_arch arm64 x86_64
          hdiutil verify dist/release/Dex-0.0.0.dmg
          test "$(plutil -extract SUFeedURL raw dist/release/Dex.app/Contents/Info.plist)" = \
            "https://github.com/decocereus/dex-notch/releases/latest/download/appcast.xml"
          test -n "$(plutil -extract SUPublicEDKey raw dist/release/Dex.app/Contents/Info.plist)"
